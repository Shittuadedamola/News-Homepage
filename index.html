<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>News Homepage</title>
</head>
<body class="px-[1rem] py-[2rem]">
    <nav id="nav" class="flex justify-between">
        <img src="images/logo.svg" 
        alt=""
        class="w-[50px] h-[30px]"
        >
        <section id="hamburger">
            <div class="w-[40px] h-[3px] bg-black mt-1 mb-1"></div>
            <div class="w-[40px] h-[3px] bg-black mb-1"></div>
            <div class="w-[40px] h-[3px] bg-black"></div>
        </section>
    </nav>
    <section id="parent">
        <img src="images/image-web-3-mobile.jpg" 
        alt=""
        class="my-10"
        >
        <h1 class="font-bold text-5xl">The Bright Future of Web 3.0?</h1>
        <span class="text-xl text-gray-500">We dive into the next evolution of the web that claims to put the power
            of the platformas back into the hands of the people. But is it really fulfilling 
            its promise?
        </span>
        <button class="button">
            READ MORE
        </button>
    </section>
</body>
</html>
